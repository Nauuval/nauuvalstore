<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Katalog Produk — Nauuvalstore</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --void: #08080A;
    --panel: #131316;
    --panel-2: #1B1B1F;
    --bone: #F2F2F0;
    --ash: #8B8B93;
    --ash-dim: #5C5C63;
    --line: #2A2A2F;
    --radius-lg: 22px;
    --radius-md: 14px;
    --accent-blox: #E74C3C;
    --accent-fisch: #3498DB;
  }

  *{ box-sizing: border-box; }
  html{ scroll-behavior: smooth; }
  body{
    margin:0;
    background: var(--void);
    color: var(--bone);
    font-family: 'Inter', sans-serif;
    line-height: 1.55;
    -webkit-font-smoothing: antialiased;
    background-image:
      radial-gradient(1px 1px at 20% 30%, rgba(255,255,255,0.35) 0, transparent 100%),
      radial-gradient(1px 1px at 70% 15%, rgba(255,255,255,0.25) 0, transparent 100%),
      radial-gradient(1.5px 1.5px at 85% 60%, rgba(255,255,255,0.3) 0, transparent 100%);
    background-repeat: no-repeat;
    background-attachment: fixed;
  }
  h1,h2,h3{
    font-family: 'Sora', sans-serif;
    color: var(--bone);
    margin: 0;
    line-height: 1.15;
  }
  p{ margin: 0; }
  a{ color: inherit; text-decoration: none; }
  img{ display:block; max-width:100%; }
  .wrap{
    max-width: 1120px;
    margin: 0 auto;
    padding: 0 24px;
  }

  /* Header */
  header{
    position: sticky;
    top: 0;
    z-index: 40;
    background: rgba(8, 8, 10, 0.75);
    backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--line);
  }
  .nav{
    display:flex;
    align-items:center;
    justify-content: space-between;
    padding: 16px 24px;
  }
  .brand{
    display:flex;
    align-items:center;
    gap:10px;
    font-family:'Sora', sans-serif;
    font-weight:700;
    font-size: 1.1rem;
    color: var(--bone);
  }
  .brand-mark{
    width: 36px; height: 36px;
    border-radius: 10px;
    object-fit: cover;
    border: 1px solid var(--line);
  }
  .nav-links{
    display:flex;
    gap: 28px;
    align-items:center;
  }
  .nav-links a{
    font-weight:600;
    font-size: 0.92rem;
    color: var(--ash);
    transition: color .15s ease;
  }
  .nav-links a:hover{ color: var(--bone); }
  .nav-cta{
    background: var(--bone);
    color: #0A0A0C !important;
    padding: 10px 20px;
    border-radius: 999px;
    font-weight:700;
    font-size: 0.88rem;
  }
  .nav-cta:hover{ background: #D8D8D6; }

  /* Hero katalog */
  .katalog-hero{
    padding: 80px 0 40px;
    text-align: center;
  }
  .katalog-hero h1{
    font-size: clamp(2rem, 5vw, 3rem);
    margin-bottom: 12px;
  }
  .katalog-hero p{
    color: var(--ash);
    font-size: 1.1rem;
  }
  .live-indicator{
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: var(--panel);
    border: 1px solid var(--line);
    padding: 8px 16px;
    border-radius: 999px;
    margin-top: 20px;
    font-size: 0.9rem;
    font-weight: 600;
  }
  .live-dot{
    width: 8px;
    height: 8px;
    background: #2ECC71;
    border-radius: 50%;
    animation: pulse 2s infinite;
  }
  @keyframes pulse{
    0%, 100%{ opacity: 1; }
    50%{ opacity: 0.4; }
  }

  /* Filter kategori */
  .filter-section{
    padding: 40px 0;
    border-bottom: 1px solid var(--line);
  }
  .filter-tabs{
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
    justify-content: center;
  }
  .filter-btn{
    background: var(--panel);
    border: 1px solid var(--line);
    color: var(--ash);
    padding: 12px 24px;
    border-radius: var(--radius-md);
    font-weight: 600;
    font-size: 0.95rem;
    cursor: pointer;
    transition: all .2s ease;
    font-family: 'Inter', sans-serif;
  }
  .filter-btn:hover{
    background: var(--panel-2);
    color: var(--bone);
  }
  .filter-btn.active{
    background: var(--bone);
    color: var(--void);
    border-color: var(--bone);
  }

  /* Grid produk */
  .products-section{
    padding: 60px 0 100px;
  }
  .products-grid{
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 24px;
  }
  .product-card{
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: var(--radius-lg);
    padding: 20px;
    transition: all .3s ease;
    display: none;
  }
  .product-card.visible{
    display: block;
  }
  .product-card:hover{
    transform: translateY(-4px);
    border-color: var(--ash-dim);
    box-shadow: 0 12px 32px rgba(0,0,0,0.3);
  }
  .product-category{
    display: inline-block;
    font-size: 0.75rem;
    font-weight: 700;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    color: var(--ash);
    background: var(--panel-2);
    padding: 4px 10px;
    border-radius: 6px;
    margin-bottom: 12px;
  }
  .product-name{
    font-family: 'Sora', sans-serif;
    font-weight: 700;
    font-size: 1.25rem;
    margin-bottom: 16px;
    color: var(--bone);
  }
  .product-stock{
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 12px;
    background: var(--panel-2);
    border-radius: var(--radius-md);
    margin-bottom: 16px;
  }
  .stock-label{
    font-size: 0.9rem;
    color: var(--ash);
    font-weight: 500;
  }
  .stock-value{
    font-size: 1.3rem;
    font-weight: 700;
    color: #2ECC71;
  }
  .stock-value.low{
    color: #F39C12;
  }
  .stock-value.out{
    color: var(--ash-dim);
  }
  .product-price{
    font-family: 'Sora', sans-serif;
    font-size: 1.6rem;
    font-weight: 700;
    color: var(--bone);
    margin-bottom: 16px;
  }
  .product-price span{
    font-size: 0.7rem;
    font-weight: 600;
    color: var(--ash);
  }
  .btn-order{
    width: 100%;
    background: var(--bone);
    color: var(--void);
    border: none;
    padding: 14px;
    border-radius: var(--radius-md);
    font-weight: 700;
    font-size: 0.95rem;
    cursor: pointer;
    transition: all .2s ease;
    font-family: 'Inter', sans-serif;
  }
  .btn-order:hover{
    background: #D8D8D6;
    transform: scale(1.02);
  }
  .btn-order:disabled{
    opacity: 0.5;
    cursor: not-allowed;
  }
  .btn-order:disabled:hover{
    transform: none;
  }

  .loading{
    text-align: center;
    padding: 60px 20px;
    color: var(--ash);
    font-size: 1.1rem;
  }
  .error{
    background: var(--panel);
    border: 1px solid #E74C3C;
    color: #E74C3C;
    padding: 20px;
    border-radius: var(--radius-md);
    text-align: center;
    margin: 40px 0;
  }

  @media (max-width: 860px){
    .nav-links{
      position:absolute;
      top:100%;
      left:0; right:0;
      background: var(--void);
      border-bottom: 1px solid var(--line);
      flex-direction:column;
      align-items:flex-start;
      gap: 0;
      padding: 8px 24px 20px;
      display:none;
    }
    .nav-links.open{ display:flex; }
    .nav-links a{ padding: 12px 0; width:100%; border-bottom: 1px solid var(--line); }
    .nav-links .nav-cta{ margin-top: 12px; text-align:center; border-bottom:none; }
  }
</style>
</head>
<body>

<header>
  <div class="nav wrap">
    <a href="index.html" class="brand">
      <img src="assets/logo.png" alt="Logo Nauuvalstore" class="brand-mark">
      Nauuvalstore
    </a>
    <div class="nav-links" id="navLinks">
      <a href="index.html">Beranda</a>
      <a href="katalog.html">Katalog</a>
      <a href="index.html#testimoni">Testimoni</a>
      <a href="https://wa.me/6289529834425" class="nav-cta" target="_blank" rel="noopener">Hubungi Admin</a>
    </div>
  </div>
</header>

<main>
  <section class="katalog-hero">
    <div class="wrap">
      <h1>Katalog Produk</h1>
      <p>Joki dan kebutuhan Blox Fruits & Fisch dengan stok live</p>
      <div class="live-indicator">
        <span class="live-dot"></span>
        <span id="stockStatus">Memuat data stok...</span>
      </div>
    </div>
  </section>

  <section class="filter-section">
    <div class="wrap">
      <div class="filter-tabs">
        <button class="filter-btn active" data-category="all">📦 Semua Produk</button>
        <button class="filter-btn" data-category="JOKI BLOX FRUIT"><img src="assets/bloxfruits-logo.png" style="height:20px;vertical-align:middle;margin-right:8px;">Joki Blox Fruit</button>
        <button class="filter-btn" data-category="JOKI FISCH"><img src="assets/fisch-logo.png" style="height:20px;vertical-align:middle;margin-right:8px;">Joki Fisch</button>
        <button class="filter-btn" data-category="KEBUTUHAN BLOX FRUIT"><img src="assets/bloxfruits-logo.png" style="height:20px;vertical-align:middle;margin-right:8px;">Kebutuhan Blox Fruit</button>
        <button class="filter-btn" data-category="KEBUTUHAN FISCH"><img src="assets/fisch-logo.png" style="height:20px;vertical-align:middle;margin-right:8px;">Kebutuhan Fisch</button>
      </div>
    </div>
  </section>

  <section class="products-section">
    <div class="wrap">
      <div class="products-grid" id="productsGrid">
        <div class="loading">Memuat produk...</div>
      </div>
    </div>
  </section>
</main>

<script src="assets/katalog.js"></script>

</body>
</html>
